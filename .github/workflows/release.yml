name: Release

on:
  push:
    branches:
      - master
    
    tags:
      - v*

  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_call'
    env:
      SET_PATH: |
        export PATH=/tmp/texlive/bin/x86_64-linux:$PATH
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref_name }}

      - name: Set Version
        run: echo "VERSION=${{ inputs.version || github.ref_name }}" >> $GITHUB_ENV

      - name: Install TeX Live
        run: bash .github/scripts/install-texlive.sh
      - name: Compile test file
        run: |
          ${{ env.SET_PATH }}
          make
          mv main.pdf szabo_zh-$VERSION.pdf
      - name: Create release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          files: |
            szabo_zh-v*.pdf
